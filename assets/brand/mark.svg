    <path d="M268 222 L336 280" stroke-width="36"/>
    <path d="M392 182 L389 256" stroke-width="36"/>
    <path d="M230 340 L318 330" stroke-width="36"/>
    <!-- speed lines -->
    <path d="M170 770 C 215 715, 290 668, 356 643" stroke-width="12"/>
    <path d="M164 876 C 195 835, 240 795, 290 770" stroke-width="12"/>
    <!-- arms -->
