  <svg x="0" y="0" width="1024" height="1024" viewBox="45 45 1160 1160">
  <!-- Klickode mark: red rounded square with the running click cursor. Single source for the site logo, favicon and brand kit (scripts/generate-brand-assets.mjs). -->
